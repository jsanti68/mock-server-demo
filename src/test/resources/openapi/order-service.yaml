openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
paths:
  /api/orders:
    get:
      operationId: listOrders
      summary: List orders for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /api/orders/{orderId}:
    get:
      operationId: getOrderById
      summary: Get a single order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        product:
          type: string
        total:
          type: number
        status:
          type: string
    NewOrder:
      type: object
      required: [userId, product, total]
      properties:
        userId:
          type: integer
        product:
          type: string
        total:
          type: number
    Error:
      type: object
      properties:
        error:
          type: string
